name: Release

on:
  push:
    branches: main
    paths:
      - core.md
      - chat.md
      - agent.md
      - skills/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bundles
        run: |
          mkdir -p dist
          { cat core.md; echo; cat chat.md; } > dist/instructions-for-claude.md
          { cat core.md; echo; cat agent.md; } > dist/agent-instructions.md
          for dir in skills/*/; do
            name=$(basename "$dir")
            (cd skills && zip -qr "../dist/skill-$name.zip" "$name")
          done

      - name: Write release notes
        run: |
          {
            echo "**instructions-for-claude.md**: paste into claude.ai → Settings → Instructions for Claude (also the Open WebUI system prompt)."
            echo "**agent-instructions.md**: the coding-agent bundle, for agents not managed by rc."
            echo "**skill-*.zip**: skills packaged for upload to claude.ai."
            echo
            echo "| Bundle | Words |"
            echo "|---|---|"
            echo "| Chat | $(wc -w < dist/instructions-for-claude.md) |"
            echo "| Agent | $(wc -w < dist/agent-instructions.md) |"
            echo
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$tag" dist/* \
            --title "$tag" \
            --notes-file notes.md \
            --generate-notes \
            --latest
