name: Release

on:
  push:
    branches: main
    paths:
      - "*.md"
      - "!README.md"
      - "!CLAUDE.md"
      - bundles.json
      - skills/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build bundles
        run: |
          mkdir -p dist
          for name in $(jq -r 'keys[]' bundles.json); do
            : > "dist/$name.md"
            first=1
            for file in $(jq -r --arg n "$name" '.[$n][]' bundles.json); do
              [ "$first" = 1 ] || echo >> "dist/$name.md"
              first=0
              cat "$file" >> "dist/$name.md"
            done
          done
          cp dist/chat.md dist/instructions-for-claude.md
          for dir in skills/*/; do
            name=$(basename "$dir")
            (cd skills && zip -qr "../dist/skill-$name.zip" "$name")
          done

      - name: Write release notes
        run: |
          {
            echo "**chat.md**: paste into claude.ai → Settings → Instructions for Claude (also the Open WebUI system prompt). **instructions-for-claude.md** is the same file under a stable name."
            echo "**agent.md**: the coding-agent bundle for hosts that can reach the MCP gateway."
            echo "**agent-standalone.md**: the coding-agent bundle without gateway tools and memory."
            echo "**skill-*.zip**: skills packaged for upload to claude.ai."
            echo
            echo "| Bundle | Words |"
            echo "|---|---|"
            for name in $(jq -r 'keys[]' bundles.json); do
              echo "| $name | $(wc -w < "dist/$name.md") |"
            done
            echo
          } > notes.md

      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" dist/* \
            --title "$tag" \
            --notes-file notes.md \
            --generate-notes \
            --latest

  notify:
    needs: release
    if: needs.release.result == 'success' || needs.release.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # A Slack outage must not turn a published release red.
      - name: Notify Slack of the release
        if: needs.release.result == 'success'
        continue-on-error: true
        uses: stackptr/actions/slack-notify@b165abf73542f37725926c8e2ba3ad26942ed1eb # feat-slack-notify-action, re-pin to v1.0.0
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: success
          title: llm-profile ${{ needs.release.outputs.tag }} released
          fields: |
            Release: <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}|${{ needs.release.outputs.tag }}>
      - name: Notify Slack of the failure
        if: needs.release.result == 'failure'
        uses: stackptr/actions/slack-notify@b165abf73542f37725926c8e2ba3ad26942ed1eb # feat-slack-notify-action, re-pin to v1.0.0
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: failure
          failed-jobs: true
